<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ब्रज प्रान्त — दायित्व प्रपत्र</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700&family=Tiro+Devanagari+Hindi&display=swap');

  :root {
    --saffron: #D4500A;
    --dark: #1C1C1C;
    --mid: #444444;
    --light-gray: #F5F5F5;
    --border: #CCCCCC;
    --red: #C62828;
    --green: #2E7D32;
    --white: #FFFFFF;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans Devanagari', sans-serif;
    background: #EFEFEF;
    color: var(--dark);
    min-height: 100vh;
  }

  header {
    background: var(--dark);
    color: white;
    padding: 18px 24px;
    text-align: center;
    border-bottom: 5px solid var(--saffron);
  }

  header h1 {
    font-family: 'Tiro Devanagari Hindi', serif;
    font-size: 1.5rem;
    color: white;
  }

  header p {
    font-size: 0.82rem;
    color: #AAAAAA;
    margin-top: 3px;
  }

  .container {
    max-width: 700px;
    margin: 0 auto;
    padding: 20px 14px 60px;
  }

  .card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 18px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }

  .card-title {
    font-size: 1rem;
    font-weight: 700;
    color: var(--saffron);
    border-bottom: 2px solid var(--saffron);
    padding-bottom: 8px;
    margin-bottom: 16px;
  }

  label {
    display: block;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--mid);
    margin-bottom: 4px;
    margin-top: 12px;
  }

  label:first-of-type { margin-top: 0; }

  select, input[type="text"], input[type="tel"], input[type="number"] {
    width: 100%;
    padding: 9px 11px;
    border: 1.5px solid var(--border);
    border-radius: 6px;
    font-family: 'Noto Sans Devanagari', sans-serif;
    font-size: 0.9rem;
    color: var(--dark);
    background: var(--light-gray);
  }

  select:focus, input:focus {
    outline: none;
    border-color: var(--saffron);
    background: white;
  }

  .select-wrap { position: relative; }
  .select-wrap::after {
    content: '▾';
    position: absolute;
    right: 11px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--saffron);
    pointer-events: none;
  }

  .hidden { display: none; }
  .dayitva-section { display: none; }

  .dayitva-block {
    background: var(--white);
    border: 1px solid var(--border);
    border-left: 4px solid var(--saffron);
    border-radius: 6px;
    padding: 14px;
    margin-bottom: 14px;
  }

  .dayitva-block.sah {
    border-left: 4px solid #888;
    background: var(--light-gray);
  }

  .dayitva-block h3 {
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--dark);
    margin-bottom: 12px;
  }

  .dayitva-block.sah h3 {
    font-size: 0.95rem;
    color: var(--mid);
  }

  .field-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .field-row.full { grid-template-columns: 1fr; }

  .field-group { margin-bottom: 8px; }
  .field-group label { margin-top: 0; font-size: 0.75rem; }

  .status-row {
    display: flex;
    gap: 12px;
    align-items: center;
    margin-top: 10px;
    flex-wrap: wrap;
  }

  .status-btn {
    padding: 6px 16px;
    border: 2px solid var(--border);
    border-radius: 20px;
    background: white;
    font-family: 'Noto Sans Devanagari', sans-serif;
    font-size: 0.82rem;
    cursor: pointer;
    font-weight: 600;
    transition: all 0.15s;
  }

  .status-btn.active-btn.selected { background: var(--green); color: white; border-color: var(--green); }
  .status-btn.inactive-btn.selected { background: var(--red); color: white; border-color: var(--red); }

  .maah-wrap { display: none; align-items: center; gap: 8px; }
  .maah-wrap label { margin: 0; font-size: 0.78rem; white-space: nowrap; }
  .maah-wrap input { width: 70px; }

  .submit-btn {
    width: 100%;
    padding: 13px;
    background: var(--saffron);
    color: white;
    border: none;
    border-radius: 7px;
    font-family: 'Noto Sans Devanagari', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s;
    margin-top: 6px;
  }

  .submit-btn:hover { background: #B8400A; }
  .submit-btn:disabled { background: #AAA; cursor: not-allowed; }

  .success-box {
    display: none;
    background: #E8F5E9;
    border: 2px solid var(--green);
    border-radius: 8px;
    padding: 24px;
    text-align: center;
    margin-top: 16px;
  }

  .success-box h2 { color: var(--green); font-size: 1.2rem; margin-bottom: 6px; }
  .success-box p { color: #388E3C; font-size: 0.88rem; }

  .loading { display: none; text-align: center; padding: 10px; color: var(--mid); font-size: 0.9rem; }
  .error-msg { display: none; color: var(--red); font-size: 0.82rem; margin-top: 6px; }

  .note { font-size: 0.76rem; color: #888; margin-top: 8px; }

  .section-label {
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #888;
    margin: 18px 0 8px;
  }
</style>
</head>
<body>

<header>
  <h1>ब्रज प्रान्त — दायित्व प्रपत्र</h1>
  <p>राष्ट्रीय स्वयंसेवक संघ</p>
</header>

<div class="container">

  <div class="card" id="card-star">
    <div class="card-title">संगठनात्मक स्तर चुनें</div>

    <label>स्तर</label>
    <div class="select-wrap">
      <select id="sel-star" onchange="onStarChange()">
        <option value="">— स्तर चुनें —</option>
        <option value="prant">प्रान्त</option>
        <option value="vibhag">विभाग</option>
        <option value="jila">जिला</option>
        <option value="mahanagar">महानगर</option>
      </select>
    </div>

    <!-- प्रान्त — कोई sub-select नहीं -->

    <!-- विभाग -->
    <div id="wrap-vibhag" class="hidden">
      <label>विभाग</label>
      <div class="select-wrap">
        <select id="sel-vibhag" onchange="onIkaiChange()">
          <option value="">— विभाग चुनें —</option>
          <option>मथुरा विभाग</option>
          <option>आगरा विभाग</option>
          <option>चंद्रनगर विभाग</option>
          <option>शाहजीपुर विभाग</option>
          <option>बरेली विभाग</option>
          <option>बदायूं विभाग</option>
          <option>एटा विभाग</option>
          <option>हरीगढ़ विभाग</option>
        </select>
      </div>
    </div>

    <!-- जिला -->
    <div id="wrap-jila" class="hidden">
      <label>विभाग</label>
      <div class="select-wrap">
        <select id="sel-jila-vibhag" onchange="onJilaVibhagChange()">
          <option value="">— विभाग चुनें —</option>
          <option value="mathura">मथुरा विभाग</option>
          <option value="agra">आगरा विभाग</option>
          <option value="chandranagar">चंद्रनगर विभाग</option>
          <option value="shahjipur">शाहजीपुर विभाग</option>
          <option value="bareilly">बरेली विभाग</option>
          <option value="badayun">बदायूं विभाग</option>
          <option value="eta">एटा विभाग</option>
          <option value="harigadh">हरीगढ़ विभाग</option>
        </select>
      </div>
      <label>जिला</label>
      <div class="select-wrap">
        <select id="sel-jila" onchange="onIkaiChange()">
          <option value="">— पहले विभाग चुनें —</option>
        </select>
      </div>
    </div>

    <!-- महानगर -->
    <div id="wrap-mahanagar" class="hidden">
      <label>महानगर</label>
      <div class="select-wrap">
        <select id="sel-mahanagar" onchange="onIkaiChange()">
          <option value="">— महानगर चुनें —</option>
          <option>मथुरा महानगर</option>
          <option>आगरा महानगर</option>
          <option>शाहजीपुर महानगर</option>
          <option>बरेली महानगर</option>
          <option>बदायूं महानगर</option>
          <option>एटा महानगर</option>
          <option>हरीगढ़ महानगर</option>
          <option>अलीगढ़ महानगर</option>
        </select>
      </div>
    </div>
  </div>

  <!-- दायित्व fields -->
  <div id="dayitva-section" class="dayitva-section">
    <div class="card">
      <div class="card-title" id="dayitva-title">दायित्ववान कार्यकर्ता</div>
      <div id="dayitva-fields"></div>
    </div>

    <div class="loading" id="loading-msg">⏳ डेटा भेजा जा रहा है...</div>
    <div class="error-msg" id="error-msg">❌ कुछ गलत हुआ। पुनः प्रयास करें।</div>
    <button class="submit-btn" id="submit-btn" onclick="submitForm()">✅ डेटा सुरक्षित करें</button>
    <p class="note">* केवल उपलब्ध जानकारी भरें। सभी field अनिवार्य नहीं।</p>
  </div>

  <div class="success-box" id="success-box">
    <h2>✅ डेटा सफलतापूर्वक सुरक्षित हो गया!</h2>
    <p>जानकारी Google Sheet में दर्ज कर दी गई है।</p>
    <br>
    <button class="submit-btn" style="max-width:200px;margin:0 auto;display:block;" onclick="resetForm()">नया प्रपत्र भरें</button>
  </div>

</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxld2aL-hn4xkiysjAQ_MoRoviNaSQtxAI1tPRfl00I2sjS8C0h9-A7qm5F5RRXMgw/exec';

const jilaMap = {
  mathura: ['मथुरा', 'कोसी', 'वृन्दावन'],
  agra: ['आगरा पश्चिम', 'आगरा पूर्वी', 'आगरा छावनी', 'रामबाग', 'सीकरी', 'फतेहाबाद'],
  chandranagar: ['चंद्रनगर', 'शिकोहाबाद', 'टूंडला', 'मैनपुरी'],
  shahjipur: ['शाहजीपुर ग्रा0', 'परशुरामपुरी'],
  bareilly: ['बरेली', 'आंवला', 'बहेड़ी', 'पीलीभीत', 'बीसलपुर'],
  badayun: ['बदायूं', 'सहसवान'],
  eta: ['एटा', 'कासगंज'],
  harigadh: ['हरीगढ़', 'अतरौली', 'खैर', 'हाथरस']
};

const prantList = [
  { key: 'prant_pramukh', label: 'प्रान्त प्रमुख', isMukhy: true },
  { key: 'prant_sanyojak', label: 'प्रान्त संयोजक', isMukhy: true },
  { key: 'sah_prant_sanyojak_1', label: 'सह प्रान्त संयोजक (1)', isMukhy: false },
  { key: 'sah_prant_sanyojak_2', label: 'सह प्रान्त संयोजक (2)', isMukhy: false },
  { key: 'prant_pariyojna', label: 'प्रान्त परियोजना प्रमुख', isMukhy: true },
  { key: 'sah_prant_pariyojna_1', label: 'सह प्रान्त परियोजना प्रमुख (1)', isMukhy: false },
  { key: 'sah_prant_pariyojna_2', label: 'सह प्रान्त परियोजना प्रमुख (2)', isMukhy: false },
  { key: 'prant_sanskriti', label: 'प्रान्त संस्कृति प्रमुख', isMukhy: true },
  { key: 'sah_prant_sanskriti_1', label: 'सह प्रान्त संस्कृति प्रमुख (1)', isMukhy: false },
  { key: 'sah_prant_sanskriti_2', label: 'सह प्रान्त संस्कृति प्रमुख (2)', isMukhy: false },
  { key: 'prant_prashashan', label: 'प्रान्त प्रशासन संपर्क प्रमुख', isMukhy: true },
  { key: 'sah_prant_prashashan_1', label: 'सह प्रान्त प्रशासन संपर्क प्रमुख (1)', isMukhy: false },
  { key: 'sah_prant_prashashan_2', label: 'सह प्रान्त प्रशासन संपर्क प्रमुख (2)', isMukhy: false },
  { key: 'prant_vidhi', label: 'प्रान्त विधि प्रमुख', isMukhy: true },
  { key: 'sah_prant_vidhi_1', label: 'सह प्रान्त विधि प्रमुख (1)', isMukhy: false },
  { key: 'sah_prant_vidhi_2', label: 'सह प्रान्त विधि प्रमुख (2)', isMukhy: false },
  { key: 'prant_nidhi', label: 'प्रान्त निधि प्रमुख', isMukhy: true },
  { key: 'sah_prant_nidhi_1', label: 'सह प्रान्त निधि प्रमुख (1)', isMukhy: false },
  { key: 'sah_prant_nidhi_2', label: 'सह प्रान्त निधि प्रमुख (2)', isMukhy: false },
];

const vibhagList = [
  { key: 'vibhag_sanyojak', label: 'विभाग संयोजक', isMukhy: true },
  { key: 'sah_vibhag_sanyojak_1', label: 'सह विभाग संयोजक (1)', isMukhy: false },
  { key: 'sah_vibhag_sanyojak_2', label: 'सह विभाग संयोजक (2)', isMukhy: false },
];

function getDayitvaList(star) {
  const prefix = star === 'jila' ? 'जिला' : 'महानगर';
  return [
    { key: 'sanyojak', label: `${prefix} संयोजक`, isMukhy: true },
    { key: 'sah_sanyojak_1', label: `सह ${prefix} संयोजक (1)`, isMukhy: false },
    { key: 'sah_sanyojak_2', label: `सह ${prefix} संयोजक (2)`, isMukhy: false },
    { key: 'pariyojna', label: `${prefix} परियोजना प्रमुख`, isMukhy: true },
    { key: 'sah_pariyojna_1', label: `सह ${prefix} परियोजना प्रमुख (1)`, isMukhy: false },
    { key: 'sah_pariyojna_2', label: `सह ${prefix} परियोजना प्रमुख (2)`, isMukhy: false },
    { key: 'sanskriti', label: `${prefix} संस्कृति प्रमुख`, isMukhy: true },
    { key: 'sah_sanskriti_1', label: `सह ${prefix} संस्कृति प्रमुख (1)`, isMukhy: false },
    { key: 'sah_sanskriti_2', label: `सह ${prefix} संस्कृति प्रमुख (2)`, isMukhy: false },
    { key: 'prashashan', label: `${prefix} प्रशासन संपर्क प्रमुख`, isMukhy: true },
    { key: 'sah_prashashan_1', label: `सह ${prefix} प्रशासन संपर्क प्रमुख (1)`, isMukhy: false },
    { key: 'sah_prashashan_2', label: `सह ${prefix} प्रशासन संपर्क प्रमुख (2)`, isMukhy: false },
    { key: 'vidhi', label: `${prefix} विधि प्रमुख`, isMukhy: true },
    { key: 'sah_vidhi_1', label: `सह ${prefix} विधि प्रमुख (1)`, isMukhy: false },
    { key: 'sah_vidhi_2', label: `सह ${prefix} विधि प्रमुख (2)`, isMukhy: false },
    { key: 'nidhi', label: `${prefix} निधि प्रमुख`, isMukhy: true },
    { key: 'sah_nidhi_1', label: `सह ${prefix} निधि प्रमुख (1)`, isMukhy: false },
    { key: 'sah_nidhi_2', label: `सह ${prefix} निधि प्रमुख (2)`, isMukhy: false },
  ];
}

function onStarChange() {
  const star = document.getElementById('sel-star').value;
  ['wrap-vibhag','wrap-jila','wrap-mahanagar'].forEach(id => document.getElementById(id).classList.add('hidden'));
  document.getElementById('dayitva-section').style.display = 'none';

  if (star === 'vibhag') document.getElementById('wrap-vibhag').classList.remove('hidden');
  if (star === 'jila') document.getElementById('wrap-jila').classList.remove('hidden');
  if (star === 'mahanagar') document.getElementById('wrap-mahanagar').classList.remove('hidden');
  if (star === 'prant') onIkaiChange();
}

function onJilaVibhagChange() {
  const v = document.getElementById('sel-jila-vibhag').value;
  const sel = document.getElementById('sel-jila');
  sel.innerHTML = '<option value="">— जिला चुनें —</option>';
  if (jilaMap[v]) jilaMap[v].forEach(j => { const o = document.createElement('option'); o.value = j; o.text = j; sel.appendChild(o); });
  document.getElementById('dayitva-section').style.display = 'none';
}

function onIkaiChange() {
  const star = document.getElementById('sel-star').value;
  let ikaiNaam = '', vibhagNaam = '';

  if (star === 'prant') { ikaiNaam = 'ब्रज प्रान्त'; vibhagNaam = ''; }
  else if (star === 'vibhag') { ikaiNaam = document.getElementById('sel-vibhag').value; vibhagNaam = ikaiNaam; }
  else if (star === 'jila') { ikaiNaam = document.getElementById('sel-jila').value; vibhagNaam = document.getElementById('sel-jila-vibhag').options[document.getElementById('sel-jila-vibhag').selectedIndex].text; }
  else if (star === 'mahanagar') { ikaiNaam = document.getElementById('sel-mahanagar').value; }

  if (!ikaiNaam) return;

  let list;
  if (star === 'prant') list = prantList;
  else if (star === 'vibhag') list = vibhagList;
  else list = getDayitvaList(star);

  renderFields(list);
  document.getElementById('dayitva-section').style.display = 'block';
  document.getElementById('dayitva-title').textContent = `${ikaiNaam} — दायित्ववान कार्यकर्ता`;
}

function renderFields(list) {
  const container = document.getElementById('dayitva-fields');
  container.innerHTML = '';
  list.forEach(d => {
    const block = document.createElement('div');
    block.className = 'dayitva-block' + (d.isMukhy ? '' : ' sah');
    block.innerHTML = `
      <h3>${d.label}</h3>
      <div class="field-row full">
        <div class="field-group">
          <label>नाम</label>
          <input type="text" id="naam_${d.key}" placeholder="पूरा नाम">
        </div>
      </div>
      <div class="field-row">
        <div class="field-group">
          <label>मोबाइल नंबर</label>
          <input type="tel" id="mobile_${d.key}" placeholder="10 अंक" maxlength="10">
        </div>
        <div class="field-group">
          <label>WhatsApp नंबर</label>
          <div style="display:flex;gap:6px;align-items:center;">
            <input type="tel" id="whatsapp_${d.key}" placeholder="10 अंक" maxlength="10" style="flex:1;">
            <button type="button" onclick="copyMobile('${d.key}')" style="white-space:nowrap;padding:8px 8px;background:#25D366;color:white;border:none;border-radius:6px;font-size:0.7rem;cursor:pointer;font-family:inherit;font-weight:600;">Same</button>
          </div>
        </div>
      </div>
      <div class="status-row">
        <span style="font-size:0.8rem;font-weight:600;color:#555;">सक्रियता:</span>
        <button type="button" class="status-btn active-btn" id="active_${d.key}" onclick="setStatus('${d.key}','active')">✅ सक्रिय</button>
        <button type="button" class="status-btn inactive-btn" id="inactive_${d.key}" onclick="setStatus('${d.key}','inactive')">❌ निष्क्रिय</button>
        <div class="maah-wrap" id="maah_wrap_${d.key}">
          <label>कितने माह से:</label>
          <input type="number" id="maah_${d.key}" min="1" max="60" placeholder="माह">
        </div>
      </div>
    `;
    container.appendChild(block);
  });
}


function copyMobile(key) {
  const mob = document.getElementById("mobile_" + key)?.value.trim();
  if (mob) document.getElementById("whatsapp_" + key).value = mob;
  else alert("पहले मोबाइल नंबर भरें।");
}

function setStatus(key, status) {
  document.getElementById('active_' + key).classList.remove('selected');
  document.getElementById('inactive_' + key).classList.remove('selected');
  document.getElementById('active_' + key).dataset.val = '';
  document.getElementById('inactive_' + key).dataset.val = '';

  if (status === 'active') {
    document.getElementById('active_' + key).classList.add('selected');
    document.getElementById('active_' + key).dataset.val = 'active';
    document.getElementById('maah_wrap_' + key).style.display = 'none';
  } else {
    document.getElementById('inactive_' + key).classList.add('selected');
    document.getElementById('inactive_' + key).dataset.val = 'inactive';
    document.getElementById('maah_wrap_' + key).style.display = 'flex';
  }
}

function getIkaiNaam() {
  const star = document.getElementById('sel-star').value;
  if (star === 'prant') return 'ब्रज प्रान्त';
  if (star === 'vibhag') return document.getElementById('sel-vibhag').value;
  if (star === 'jila') return document.getElementById('sel-jila').value;
  if (star === 'mahanagar') return document.getElementById('sel-mahanagar').value;
  return '';
}

function getVibhagNaam() {
  const star = document.getElementById('sel-star').value;
  if (star === 'vibhag') return document.getElementById('sel-vibhag').value;
  if (star === 'jila') return document.getElementById('sel-jila-vibhag').options[document.getElementById('sel-jila-vibhag').selectedIndex].text;
  return '';
}

async function submitForm() {
  const star = document.getElementById('sel-star').value;
  const ikaiNaam = getIkaiNaam();
  const vibhagNaam = getVibhagNaam();
  if (!star || !ikaiNaam) { alert('कृपया स्तर और इकाई चुनें।'); return; }

  let list;
  if (star === 'prant') list = prantList;
  else if (star === 'vibhag') list = vibhagList;
  else list = getDayitvaList(star);

  const rows = [];
  list.forEach(d => {
    const naam = document.getElementById('naam_' + d.key)?.value.trim() || '';
    const mobile = document.getElementById('mobile_' + d.key)?.value.trim() || '';
    const activeBtn = document.getElementById('active_' + d.key);
    const inactiveBtn = document.getElementById('inactive_' + d.key);
    let sakriyta = '';
    if (activeBtn?.classList.contains('selected')) sakriyta = 'सक्रिय';
    if (inactiveBtn?.classList.contains('selected')) sakriyta = 'निष्क्रिय';
    const maah = document.getElementById('maah_' + d.key)?.value.trim() || '';
    const whatsapp = document.getElementById('whatsapp_' + d.key)?.value.trim() || '';
    rows.push({ star, vibhag: vibhagNaam, ikai: ikaiNaam, dayitva: d.label, isMukhy: d.isMukhy, naam, mobile, whatsapp, sakriyta, maah });
  });

  document.getElementById('submit-btn').disabled = true;
  document.getElementById('loading-msg').style.display = 'block';
  document.getElementById('error-msg').style.display = 'none';

  try {
    await fetch(SCRIPT_URL, {
      method: 'POST', mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ rows })
    });
    document.getElementById('loading-msg').style.display = 'none';
    document.getElementById('dayitva-section').style.display = 'none';
    document.getElementById('card-star').style.display = 'none';
    document.getElementById('success-box').style.display = 'block';
  } catch (err) {
    document.getElementById('loading-msg').style.display = 'none';
    document.getElementById('error-msg').style.display = 'block';
    document.getElementById('submit-btn').disabled = false;
  }
}

function resetForm() {
  document.getElementById('sel-star').value = '';
  ['wrap-vibhag','wrap-jila','wrap-mahanagar'].forEach(id => document.getElementById(id).classList.add('hidden'));
  document.getElementById('dayitva-section').style.display = 'none';
  document.getElementById('dayitva-fields').innerHTML = '';
  document.getElementById('success-box').style.display = 'none';
  document.getElementById('card-star').style.display = 'block';
  document.getElementById('submit-btn').disabled = false;
}

// URL pre-fill
window.onload = function() {
  const p = new URLSearchParams(window.location.search);
  const star = p.get('star'), ikai = p.get('ikai'), vibhag = p.get('vibhag');
  if (star) {
    document.getElementById('sel-star').value = star;
    onStarChange();
    setTimeout(() => {
      if (star === 'vibhag' && ikai) { document.getElementById('sel-vibhag').value = ikai; onIkaiChange(); }
      else if (star === 'jila' && vibhag && ikai) {
        document.getElementById('sel-jila-vibhag').value = vibhag;
        onJilaVibhagChange();
        setTimeout(() => { document.getElementById('sel-jila').value = ikai; onIkaiChange(); }, 100);
      } else if (star === 'mahanagar' && ikai) { document.getElementById('sel-mahanagar').value = ikai; onIkaiChange(); }
    }, 100);
  }
};
</script>
